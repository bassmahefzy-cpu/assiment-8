<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactHub - Smart Contact Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header class="site-header">
        <div class="header-container">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-address-book"></i>
                </div>
                <div class="brand-text">
                    <h1>Contact<span>Hub</span></h1>
                    <p>Smart Contact Manager</p>
                </div>
            </div>
            <div class="header-actions">
                <button type="button" id="openAddModalBtn" class="add-contact-btn">
                    <i class="fa-solid fa-plus"></i>Add Contact</button>
                <button type="button" class="header-icon" aria-label="Notifications">
                    <i class="fa-solid fa-bell"></i>
                </button>
                <button type="button" class="header-icon" aria-label="Settings">
                    <i class="fa-solid fa-gear"></i>
                </button>
                <div class="header-avatar">
                    <img src="./images/avatar-4.jpg" alt="Profile">
                </div>
            </div>
    </header>
    <main class="page-container">
        <section class="stats-grid">
            <article class="stat-card">
                <div class="stat-icon total-icon">
                    <i class="fa-solid fa-user-group"></i>
                </div>
                <div>
                    <span>TOTAL</span>
                    <strong id="totalCount">0</strong>
                </div>
            </article>
            <article class="stat-card">
                <div class="stat-icon favorite-icon">
                    <i class="fa-solid fa-star"></i>
                </div>
                <div>
                    <span>FAVORITES</span>
                    <strong id="favoriteCount">0</strong>
                </div>
            </article>
            <article class="stat-card">
                <div class="stat-icon emergency-icon">
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>
                <div>
                    <span>EMERGENCY</span>
                    <strong id="emergencyCount">0</strong>
                </div>
            </article>
        </section>
        <section class="dashboard-grid">
            <div class="contacts-area">
                <div class="contacts-heading">
                    <h2>All Contacts</h2>
                    <p id="contactsSubtitle">Manage and organize your 0 contacts</p>
                </div>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search by name, phone, or email..."
                        autocomplete="off">
                </div>
                <div id="contactsContainer" class="contacts-container"></div>
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">
                        <i class="fa-solid fa-address-book"></i>
                    </div>
                    <h3>No contacts found</h3>
                    <p>Click "Add Contact" to get started</p>
                </div>
            </div>
            <aside class="side-panels">
                <section class="side-card">
                    <div class="side-card-header favorites-header">
                        <div class="side-title-icon favorite-small">
                            <i class="fa-solid fa-star"></i>
                        </div>
                        <div>
                            <h3>Favorites</h3>
                            <p>Quick access to starred contacts</p>
                        </div>
                    </div>
                    <div id="favoritesList" class="side-card-content"></div>
                </section>
                <section class="side-card">
                    <div class="side-card-header emergency-header">
                        <div class="side-title-icon emergency-small">
                            <i class="fa-solid fa-heart-pulse"></i>
                        </div>
                        <div>
                            <h3>Emergency</h3>
                            <p>Important contacts for urgent calls</p>
                        </div>
                    </div>
                    <div id="emergencyList" class="side-card-content"></div>
                </section>
            </aside>
        </section>
    </main>
    <div id="contactModal" class="modal-overlay">
        <div class="contact-modal">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Contact</h2>
                <button type="button" id="closeModalBtn" class="close-modal-btn" aria-label="Close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="contactForm" novalidate>
                <div class="modal-body">
                    <div class="photo-area">
                        <div id="photoPreview" class="photo-preview">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <label for="photoInput" class="change-photo-btn">
                            <i class="fa-solid fa-camera"></i>Change Photo</label>
                        <input type="file" id="photoInput" accept="image/*" hidden>
                    </div>
                    <div class="form-group">
                        <label for="nameInput">
                            Full Name
                            <span>*</span>
                        </label>

                        <input type="text" id="nameInput" placeholder="Enter full name">
                        <small id="nameError" class="error-message"></small>
                    </div>
                    <div class="form-group">
                        <label for="phoneInput">
                            Phone Number
                            <span>*</span>
                        </label>
                        <input type="tel" id="phoneInput" placeholder="e.g., 01012345678">
                        <small id="phoneError" class="error-message"></small>
                    </div>
                    <div class="form-group">
                        <label for="emailInput">Email Address</label>
                        <input type="email" id="emailInput" placeholder="name@example.com">
                        <small id="emailError" class="error-message"></small>
                    </div>
                    <div class="form-group">
                        <label for="addressInput">
                            Address
                        </label>
                        <input type="text" id="addressInput" placeholder="Enter address">
                    </div>
                    <div class="form-group">
                        <label for="groupInput">Group</label>
                        <select id="groupInput">
                            <option value="">Select a group</option>
                            <option value="Family">Family</option>
                            <option value="Friends">Friends</option>
                            <option value="Work">Work</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="notesInput">Notes</label>
                        <textarea id="notesInput" placeholder="Add notes about this contact"></textarea>
                    </div>
                    <div class="checkbox-row">
                        <label class="checkbox-label">
                            <input type="checkbox" id="favoriteInput">
                            <span class="custom-checkbox"></span>
                            <i class="fa-solid fa-star favorite-check-icon"></i>Favorite</label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="emergencyInput">
                            <span class="custom-checkbox"></span>
                            <i class="fa-solid fa-heart-pulse emergency-check-icon"></i>Emergency</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" id="cancelBtn" class="cancel-btn">Cancel</button>
                    <button type="submit" class="save-btn">
                        <i class="fa-solid fa-check"></i>
                        <span id="saveButtonText">Save Contact</span></button>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./script.js"></script>
</body>

</html>
